name: Optimizar imágenes

on:
  push:
    branches: ["main"]
    paths:
      - 'images/quejas/**'
      - 'images/blog/**'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    # Evita que el Action se dispare a sí mismo en un loop infinito
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo, necesario para comparar el rango real del push

      - name: Instalar herramientas de imagen
        run: sudo apt-get update && sudo apt-get install -y jpegoptim optipng webp

      - name: Comprimir imágenes nuevas o modificadas
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # Si "before" es el commit nulo (primer push a la rama), compara contra el árbol vacío
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git hash-object -t tree /dev/null)
          fi

          IMAGES=$(git diff --name-only "$BEFORE" "$AFTER" -- 'images/quejas/*.jpg' 'images/quejas/*.jpeg' 'images/quejas/*.png' 'images/blog/*.jpg' 'images/blog/*.jpeg' 'images/blog/*.png' 2>/dev/null || true)

          for img in $IMAGES; do
            if [ -f "$img" ]; then
              echo "Comprimiendo: $img"
              case "$img" in
                *.jpg|*.jpeg) jpegoptim --max=80 --strip-all "$img" ;;
                *.png) optipng -o5 "$img" ;;
              esac
            fi
          done

          # WebP nuevos o modificados: recompresión CON pérdida controlada (calidad 82).
          # Si el .webp de origen ya venía de una compresión lossy, esto es pérdida sobre pérdida.
          # Cambiá a "cwebp -lossless" si preferís no perder calidad en absoluto (pesa más).
          WEBPS=$(git diff --name-only "$BEFORE" "$AFTER" -- 'images/quejas/*.webp' 'images/blog/*.webp' 2>/dev/null || true)
          for img in $WEBPS; do
            if [ -f "$img" ]; then
              echo "Recomprimiendo WebP: $img"
              cwebp -q 82 "$img" -o "$img.tmp" && mv "$img.tmp" "$img"
            fi
          done

      - name: Commitear las imágenes optimizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Comprimir imágenes automáticamente [skip ci]"
          git push

name: Migrar imagenes a R2

# Se ejecuta a mano: pestana Actions > "Migrar imagenes a R2" > Run workflow.
# Copia images/blog (GitHub) y las imagenes del bucket post-images (Supabase)
# al bucket bmm-imagenes de Cloudflare R2, con el mismo nombre de archivo.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo simular, sin subir nada (true o false)"
        default: "true"

permissions:
  contents: read

env:
  BUCKET: bmm-imagenes
  SUPABASE_BASE: https://iolchsadedieagiqrxzu.supabase.co/storage/v1/object/public/post-images
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar endpoint de R2
        run: |
          # Deja solo https://<cuenta>.r2.cloudflarestorage.com (quita lo que venga despues)
          ENDPOINT=$(echo "${{ secrets.R2_ENDPOINT }}" | sed -E 's#(https://[^/]+).*#\1#')
          echo "ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"

      - name: Copiar imagenes de GitHub (images/blog)
        run: |
          set -euo pipefail
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dryrun"; fi
          echo "Archivos en images/blog: $(find images/blog -type f | wc -l)"
          aws s3 sync images/blog "s3://$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --exclude ".*" --exclude "*/.*" \
            --cache-control "public, max-age=31536000" \
            $DRY

      - name: Copiar imagenes de Supabase
        run: |
          set -uo pipefail
          cat > nombres.txt <<'EOF'
          _originals/1.webp
          _originals/1790622553911-3j12i9.webp

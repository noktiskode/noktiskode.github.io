          EOF

          echo "Nombres en la lista: $(wc -l < nombres.txt)"
          mkdir -p supabase-descarga
          FALLAS=0
          while IFS= read -r nombre; do
            [ -z "$nombre" ] && continue
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              CODIGO=$(curl -s -o /dev/null -w "%{http_code}" -I "$SUPABASE_BASE/$nombre")
              [ "$CODIGO" = "200" ] || { echo "NO DISPONIBLE ($CODIGO): $nombre"; FALLAS=$((FALLAS+1)); }
            else
              mkdir -p "supabase-descarga/$(dirname "$nombre")"
              curl -sSf -o "supabase-descarga/$nombre" "$SUPABASE_BASE/$nombre" \
                || { echo "FALLO LA DESCARGA: $nombre"; FALLAS=$((FALLAS+1)); }
            fi
          done < nombres.txt

          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "Archivos descargados: $(find supabase-descarga -type f | wc -l)"
            aws s3 sync supabase-descarga "s3://$BUCKET/" \
              --endpoint-url "$ENDPOINT" \
              --cache-control "public, max-age=31536000"
          fi

          echo "Fallas: $FALLAS"
          [ "$FALLAS" -eq 0 ]

      - name: Contar objetos en el bucket
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "Objetos en $BUCKET: $(aws s3 ls "s3://$BUCKET/" --recursive --endpoint-url "$ENDPOINT" | wc -l)"

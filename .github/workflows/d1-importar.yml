name: Importar posts a D1

# Se ejecuta a mano: pestaña Actions > "Importar posts a D1" > Run workflow.
# Crea las tablas (si no existen) y carga d1/import.sql en la base "bmm-db".
# Es seguro correrlo más de una vez: usa INSERT OR REPLACE, no duplica posts.
#
# Secretos necesarios en GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "D1 Edit" (y lectura de cuenta)
#   CLOUDFLARE_ACCOUNT_ID  el ID de tu cuenta de Cloudflare

on:
  workflow_dispatch:
    inputs:
      importar:
        description: "Cargar los posts de d1/import.sql (si es false, solo crea las tablas)"
        type: choice
        options: ["true", "false"]
        default: "true"

jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear tablas
        run: npx --yes wrangler@4 d1 execute bmm-db --remote --yes --file=d1/schema.sql

      - name: Importar posts
        if: ${{ inputs.importar == 'true' }}
        run: npx --yes wrangler@4 d1 execute bmm-db --remote --yes --file=d1/import.sql

      - name: Contar posts en D1
        run: npx --yes wrangler@4 d1 execute bmm-db --remote --command "SELECT COUNT(*) AS posts, SUM(published) AS publicados FROM posts"

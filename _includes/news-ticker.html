<!--
  Estilo minimalista (blanco) para el ticker de BMM.
  Misma estructura y mecánica que tu news-ticker.html original:
  fetch a /assets/data/ticker.json, animación de desplazamiento infinito,
  pausa al pasar el mouse/foco, y respeto a prefers-reduced-motion.
  Solo cambia la paleta de colores (fondo blanco en vez de negro).
-->

<style>
.news-ticker {
  display: flex;
  align-items: stretch;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--borde);
  height: 40px;
  font-family: 'Barlow', sans-serif;
  overflow: hidden;
  box-sizing: border-box;
  transition: background .25s ease, border-color .25s ease;
}
.ticker-label {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  padding: 0 15px;
  background: var(--texto);
  color: var(--bg);
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: .72rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  white-space: nowrap;
}
.ticker-viewport {
  position: relative;
  flex: 1 1 auto;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 28px, black calc(100% - 28px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, black 28px, black calc(100% - 28px), transparent 100%);
}
.ticker-track {
  display: flex;
  align-items: center;
  height: 100%;
  width: max-content;
  will-change: transform;
}
.ticker-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 30px 0 0;
  white-space: nowrap;
  font-size: .78rem;
  font-weight: 600;
  color: var(--texto);
  text-decoration: none;
}
.ticker-item:hover .ticker-headline { color: #ef4f1d; }
.ticker-dot {
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  border: 0;
  background: var(--texto-mudo);
}
.ticker-item.ticker-denuncia .ticker-dot {
  background: #ef4f1d;
}
.ticker-headline {
  color: var(--texto);
  transition: color .15s ease;
}
.ticker-sep {
  flex: 0 0 auto;
  color: var(--texto-mudo);
  font-size: .48rem;
  margin-right: 27px;
}
.news-ticker.is-paused .ticker-track { animation-play-state: paused; }

@media (max-width: 640px) {
  .news-ticker { height: 38px; }
  .ticker-label { font-size: .65rem; padding: 0 11px; }
  .ticker-item { font-size: .72rem; padding-right: 24px; }
}
</style>

<div class="news-ticker" id="newsTicker" role="region" aria-label="Últimas noticias de Barberena Mi Municipio">
  <div class="ticker-label">Al día</div>
  <div class="ticker-viewport">
    <div class="ticker-track" id="tickerTrack">
      <a class="ticker-item"><span class="ticker-headline">Cargando noticias de Santa Rosa...</span></a>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const ticker = document.getElementById('newsTicker');
  const track = document.getElementById('tickerTrack');

  function buildItem(item) {
    const a = document.createElement('a');
    a.className = "ticker-item";
    a.href = item.url || "#";
    if (item.cat === "denuncia") a.classList.add("ticker-denuncia");

    const dot = document.createElement('span');
    dot.className = "ticker-dot";
    a.appendChild(dot);

    const headline = document.createElement('span');
    headline.className = "ticker-headline";
    headline.textContent = item.text;
    a.appendChild(headline);

    const sep = document.createElement('span');
    sep.className = "ticker-sep";
    sep.textContent = "◆";
    a.appendChild(sep);

    return a;
  }

  function calcularVelocidad() {
    // Si la persona pidió reducir movimiento en su sistema, no
    // animamos nada — se queda una lista estática y desplazable.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const anterior = document.getElementById('bmm-ticker-keyframes');
      if (anterior) anterior.remove();
      track.parentElement.style.overflowX = 'auto';
      return;
    }

    const distancia = track.scrollWidth / 2; // una sola "vuelta" de noticias
    const pixelesPorSegundo = window.innerWidth <= 640 ? 24 : 32;
    let duracion = distancia / pixelesPorSegundo;
    duracion = Math.max(duracion, 45); // nunca menos de 45s

    const styleId = 'bmm-ticker-keyframes';
    const anterior = document.getElementById(styleId);
    if (anterior) anterior.remove();

    const style = document.createElement('style');
    style.id = styleId;
    style.textContent =
      '@keyframes tickerScroll { from { transform: translateX(0); } ' +
      'to { transform: translateX(-' + distancia + 'px); } }' +
      '#tickerTrack { animation: tickerScroll ' + duracion + 's linear infinite; }';
    document.head.appendChild(style);
  }

  fetch('/assets/data/ticker.json')
    .then(response => response.json())
    .then(data => {
      track.innerHTML = "";

      if (data.length === 0) {
        const item = buildItem({ text: "No hay noticias recientes en este momento." });
        track.appendChild(item);
        const clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
        setTimeout(calcularVelocidad, 100);
        return;
      }

      data.forEach(item => track.appendChild(buildItem(item)));

      // Duplicar para el bucle; los clones no deben leerse dos veces
      // en lectores de pantalla.
      Array.from(track.children).forEach(item => {
        const clone = item.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
      });

      setTimeout(calcularVelocidad, 100);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(calcularVelocidad);
      }

      let resizeTimeout;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(calcularVelocidad, 200);
      });

      ticker.addEventListener('mouseenter', () => ticker.classList.add('is-paused'));
      ticker.addEventListener('mouseleave', () => ticker.classList.remove('is-paused'));
      ticker.addEventListener('focusin', () => ticker.classList.add('is-paused'));
      ticker.addEventListener('focusout', () => ticker.classList.remove('is-paused'));
    })
    .catch(err => {
      console.error("Error al cargar el ticker JSON:", err);
      track.innerHTML = "";
      const item = buildItem({ text: "Información local al día." });
      track.appendChild(item);
      const clone = item.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      track.appendChild(clone);
      setTimeout(calcularVelocidad, 100);
    });

});
</script>

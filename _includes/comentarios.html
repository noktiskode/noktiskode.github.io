<div id="bmm-comentarios" data-slug="{{ page.slug }}" style="max-width:640px;margin:2rem auto;font-family:-apple-system,sans-serif;color:#24291F;">
  <h3 style="font-family:Georgia,serif;font-weight:400;font-size:20px;border-bottom:1px solid #C9C2AF;padding-bottom:.5rem;">Comentarios</h3>

  <div id="comment-list" style="margin-bottom:1.5rem;"></div>

  <label style="display:block;font-size:13.5px;font-weight:600;margin:.6rem 0 .3rem;">Nombre (opcional)</label>
  <input type="text" id="c-nombre" placeholder="Vecino" style="width:100%;padding:9px 11px;font-size:14.5px;border:1px solid #C9C2AF;border-radius:4px;box-sizing:border-box;">

  <label style="display:block;font-size:13.5px;font-weight:600;margin:.9rem 0 .3rem;">Comentario</label>
  <textarea id="c-texto" placeholder="Escribí tu comentario" style="width:100%;min-height:80px;padding:9px 11px;font-size:14.5px;border:1px solid #C9C2AF;border-radius:4px;box-sizing:border-box;"></textarea>

  <button id="btn-comentar" style="margin-top:.8rem;padding:10px 20px;font-size:14.5px;font-weight:600;color:#fff;background:#B35A2E;border:none;border-radius:5px;cursor:pointer;">Enviar comentario</button>
  <p id="ok-msg" style="display:none;color:#2F6B4E;font-size:13px;margin-top:.6rem;">Comentario enviado. Se publicará tras revisión.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyC1jgfupbu5YUvfSeMh5Je9DVExXNgYd1o",
    authDomain: "bmm-comentarios.firebaseapp.com",
    projectId: "bmm-comentarios",
    storageBucket: "bmm-comentarios.firebasestorage.app",
    messagingSenderId: "601712463771",
    appId: "1:601712463771:web:60468f91d14b780aad9b3e"
  });
  const db = getFirestore(app);
  const slug = document.getElementById('bmm-comentarios').dataset.slug;

  const q = query(collection(db, "comentarios"),
    where("postSlug", "==", slug),
    where("estado", "==", "aprobado"),
    orderBy("creado", "desc"));

  onSnapshot(q, snap => {
    const list = document.getElementById('comment-list');
    if(snap.empty){ list.innerHTML = '<p style="color:#54554C;font-style:italic;font-size:13.5px;">Sin comentarios aún.</p>'; return; }
    list.innerHTML = snap.docs.map(d => {
      const c = d.data();
      return `<div style="border-bottom:1px solid #C9C2AF;padding:.7rem 0;">
        <strong style="font-size:13.5px;">${c.nombre || 'Vecino'}</strong>
        <p style="font-size:14px;margin:.3rem 0 0;">${c.texto}</p>
      </div>`;
    }).join('');
  }, err => console.error('Error leyendo comentarios:', err));

  document.getElementById('btn-comentar').addEventListener('click', async () => {
    const texto = document.getElementById('c-texto').value.trim();
    if(!texto) return;
    const nombre = document.getElementById('c-nombre').value.trim();
    try {
      await addDoc(collection(db, "comentarios"), {
        postSlug: slug, nombre: nombre || "Vecino", texto,
        estado: "pendiente", creado: serverTimestamp()
      });
      document.getElementById('c-texto').value = '';
      document.getElementById('ok-msg').style.display = 'block';
    } catch(err){
      console.error('Error enviando comentario:', err);
      alert('No se pudo enviar el comentario. Revisá la consola.');
    }
  });
        </script>

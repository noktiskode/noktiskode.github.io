<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, onSnapshot, updateDoc, doc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC1jgfupbu5YUvfSeMh5Je9DVExXNgYd1o",
    authDomain: "bmm-comentarios.firebaseapp.com",
    projectId: "bmm-comentarios",
    storageBucket: "bmm-comentarios.firebasestorage.app",
    messagingSenderId: "601712463771",
    appId: "1:601712463771:web:60468f91d14b780aad9b3e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  document.getElementById('btn-login').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    signInWithEmailAndPassword(auth, email, pass)
      .catch(() => document.getElementById('login-error').classList.add('show'));
  });

  document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, user => {
    if(!user){ mostrarLogin(); return; }
    mostrarPanel(user.email);
    const q = query(collection(db, "comentarios"), where("estado", "==", "pendiente"));
    onSnapshot(q, snap => {
      window.__pendientes = snap.docs;
      renderModeracion(snap.docs);
    });
  });

  window.aprobarComentario = (id, nuevoEstado) =>
    updateDoc(doc(db, "comentarios", id), { estado: nuevoEstado });
</script>

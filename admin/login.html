<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Barberena Mi Municipio</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f4;
    }
    form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 320px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 1.2rem; }
    input {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #ef4f1d;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #msg { color: #c0392b; font-size: 0.9rem; margin-top: 0.8rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>Iniciar sesión — BMM</h1>
    <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
    <button type="submit" id="submit-btn">Entrar</button>
    <div id="msg" role="alert"></div>
  </form>

  <script>
    // Si ya hay una sesión válida, no tiene sentido mostrar el login
    fetch('/api/admin/session', {credentials: 'same-origin'}).then(function (r) {
      if (r.ok) window.location.href = '/admin/';
    }).catch(function () {});

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Entrando…';
      msg.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: password})
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
        window.location.href = '/admin/';
      } catch (err) {
        msg.textContent = 'No se pudo iniciar sesión: ' + err.message;
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>

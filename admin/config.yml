backend:
  name: github
  repo: noktiskode/noktiskode.github.io
  branch: main
  base_url: https://barberenamimunicipio.pages.dev
  site_url: https://barberenamimunicipio.pages.dev
  auth_endpoint: api/auth

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "images/quejas"
public_folder: "/images/quejas"

locale: "es"

collections:
  - name: "quejas"
    label: "Quejas ciudadanas"
    label_singular: "Lista de quejas"
    files:
      - file: "content/quejas.json"
        label: "Quejas ciudadanas"
        name: "quejas"
        description: "Lista independiente de quejas ciudadanas."
        fields:
          - label: "Quejas"
            name: "items"
            widget: "list"
            summary: "{{fields.titulo}} — {{fields.zona}}"
            fields:
              - { label: "Título corto", name: "titulo", widget: "string", hint: "Ej. Bache gigante en la 4ª calle" }
              - { label: "Zona / colonia", name: "zona", widget: "string" }
              - { label: "Relato del vecino", name: "relato", widget: "text" }
              - { label: "Firma", name: "firma", widget: "string", default: "Vecino de Barberena", hint: "Ej. Vecino de El Progreso. No poner nombre completo si la persona pidió anonimato." }
              - { label: "Fecha (texto libre)", name: "fecha", widget: "string", hint: "Ej. 3 semanas, 5 días, 12 de julio" }
              - label: "Estado del caso"
                name: "estado"
                widget: "select"
                default: "revision"
                options:
                  - { label: "En revisión", value: "revision" }
                  - { label: "Respondida por la muni", value: "respondida" }
                  - { label: "Sin respuesta", value: "sinrespuesta" }
              - { label: "Foto (opcional)", name: "foto", widget: "image", required: false }
              - { label: "Ícono si no hay foto", name: "icono", widget: "string", default: "📢" }

  - name: "blog"
    label: "Publicaciones del blog"
    label_singular: "Publicación"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "/images/blog"
    public_folder: "/images/blog"
    fields:
      - { label: "Destacada en portada", name: "featured", widget: "boolean", default: false, required: false, hint: "Muestra esta publicación como el contenido principal de la portada." }
      - { label: "También en 'Para leer con calma'", name: "relevant", widget: "boolean", default: false, required: false, hint: "Añade esta publicación a la selección secundaria de la portada." }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen destacada", name: "image", widget: "image", required: false }
      - { label: "Resumen corto", name: "excerpt", widget: "text", required: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        required: true
        options:
          - { label: "Opiniones", value: "opiniones" }
          - { label: "Barberena", value: "barberena" }
          - { label: "Historias", value: "historias" }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        required: false
        hint: "Temas secundarios de la publicación. No aparecen como secciones principales del menú."
      - { label: "Video (Facebook o YouTube, opcional)", name: "video_url", widget: "string", required: false, hint: "Pega el link completo del video." }
      - label: "Color de tarjeta"
        name: "card_color"
        widget: "select"
        default: "rojo"
        options:
          - { label: "Rojo-naranja (BMM)", value: "rojo" }
          - { label: "Blanco", value: "blanco" }
          - { label: "Negro", value: "negro" }
      - { label: "Contenido", name: "body", widget: "markdown" }

title: Barberena Mi Municipio
description: "Blog personal sobre Barberena: opiniones, acontecimientos, historias y cosas que vale la pena comentar."
url: "https://barberenamimunicipio.top"

timezone: America/Guatemala
future: true
theme: null

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      show_hero: false
      hero_image: /images/portada.webp
      hero_alt: Barberena Mi Municipio
      hero_badge: Blog

exclude:
  - README.md

plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-feed

pagination:
  enabled: true
  per_page: 6
  permalink: '/page/:num/'
  title: ':title - Página :num'
  sort_field: 'date'
  sort_reverse: true

meses:
  - "Enero"
  - "Febrero"
  - "Marzo"
  - "Abril"
  - "Mayo"
  - "Junio"
  - "Julio"
  - "Agosto"
  - "Septiembre"
  - "Octubre"
  - "Noviembre"
  - "Diciembre"

categories:
  - { label: "Opiniones", value: "opiniones" }
  - { label: "Barberena", value: "barberena" }
  - { label: "Historias", value: "historias" }

tags:
  - Municipalidad
  - Obras
  - Agua
  - Comunidad
  - Política local
  - Finanzas públicas
  - Presupuesto
  - Servicios públicos
  - Historia
  - Personajes
  - Tradiciones
  - Patrimonio
  - Acontecimientos
  - Transporte
  - Seguridad
  - Educación
  - Santa Rosa
  - Congreso
  - Templo de Minerva
  - Antorchas
